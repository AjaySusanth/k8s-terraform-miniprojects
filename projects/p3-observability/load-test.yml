# projects/p3-observability/load-test.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-script
  namespace: default
data:
  test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';
    export const options = {
      stages: [
        { duration: '1m', target: 50 },    // Ramp up to 50 users over 1 minute
        { duration: '2m', target: 200 },   // Spike to 200 users for 2 minutes (forces scaling!)
        { duration: '1m', target: 0 },     // Ramp down to 0 users over 1 minute
      ],
    };
    export default function () {
      http.get('http://podinfo.default.svc.cluster.local:9898/');
      sleep(0.05);                         // Fast polling to generate CPU utilization
    }

---

apiVersion: v1
kind: Pod
metadata:
  name: k6-load-runner
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: k6
    image: grafana/k6:0.49.0
    command: ["k6", "run", "/scripts/test.js"]
    volumeMounts:
    - name: script-volume
      mountPath: /scripts
  volumes:
  - name: script-volume
    configMap:
      name: k6-test-script
