apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9898
      targetPort: 9898
  selector:
    app: podinfo

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
    
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.4.0
        ports:
          - containerPort: 9898
        env:
        - name: PODINFO_BACKEND_URL
          value: "http://invalid-backend:9898"   # Points to a non-existent service
        resources:
          requests:
            cpu: 300m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi

        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9898
          periodSeconds: 10
      tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: "kubernetes.azure.com/scalesetpriority"
                  operator: "In"
                  values:
                  - "spot"