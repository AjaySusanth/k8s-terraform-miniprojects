apiVersion: v1
kind: Service

metadata:
  name: vote

spec:
  type: LoadBalancer
  ports:
    - port: 5000
      targetPort: 80
  selector:
    app: vote

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote

spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec: 
      containers:
        - name: vote
          image: dockersamples/examplevotingapp_vote:latest
          env:
            - name: OPTION_A
              value: Cats
            - name: OPTION_B
              value: Dogs

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            
            limits:
              cpu: 200m
              memory: 128Mi

          ports:
            - containerPort: 80
              name: vote

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10
