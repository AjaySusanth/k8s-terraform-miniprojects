apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec: 
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    
    spec: 
      containers:
        - name: worker  
          image: dockersamples/examplevotingapp_worker:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 200m
              memory: 128Mi
          
