apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config

data:
  redis.conf: |
    maxmemory 100mb
    maxmemory-policy allkeys-lru

---

apiVersion: v1
kind: Service

metadata:
  name: redis

spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis

spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image:  redis:7.0-alpine
          command: ["redis-server"]
          args: ["/usr/local/etc/redis/redis.conf"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 6379
              name: redis

          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/              
          
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: redis-config