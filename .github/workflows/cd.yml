name: CD (Build, Push and Sync)
on:
  push:
    branches:
      - main
    paths-ignore:
    # Prevent infinite loops when the workflow updates the values.yaml
      - 'charts/podinfo/values.yaml'

permissions:
  id-token: write
  contents: write # Required to commit the updated values.yaml tag back to Git

jobs: 
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Acr
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
      
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="1.0.${{ github.run_number }}"
          IMAGE_NAME="${{ vars.ACR_NAME }}.azurecr.io/podinfo:$IMAGE_TAG"

          echo "Building Image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

          echo "tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Helm values.yaml
        run: |
          yq -i '.image.repository = "${{ vars.ACR_NAME }}.azurecr.io/podinfo"' charts/podinfo/values.yaml

          yq -i '.image.tag = "${{ env.tag }}"' charts/podinfo/values.yaml

      - name: Commit and Push tag update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add charts/podinfo/values.yaml
          git commit -m "chore: update podinfo image to ${{ env.tag }} [skip ci]"

          git push