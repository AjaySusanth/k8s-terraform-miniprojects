name: CI (Helm validation)
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'
      - name: Run helm lint
        run: helm lint charts/podinfo

        
