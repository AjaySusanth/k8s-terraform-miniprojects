apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-prod
  namespace: argocd

spec:
  project: default
  source:
    repoURL: 'https://github.com/AjaySusanth/k8s-terraform-miniprojects.git'
    targetRevision: HEAD
    path: charts/podinfo
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy: {}
